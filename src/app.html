<!doctype html>
<html lang="da">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131c3a" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Link previews. Crawlers do not run JavaScript, so these are static and in one language.
		     The image URL must be absolute, which ties it to this domain. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="My Culture Night" />
		<meta property="og:title" content="My Culture Night: Kulturnatten 2026 on one map" />
		<meta
			property="og:description"
			content="Pick your Kulturnatten events and see them together on one map. Copenhagen, Friday 9 October 2026. Unofficial planner."
		/>
		<meta property="og:url" content="https://kulturnatten.luissilva.eu/" />
		<meta property="og:image" content="https://kulturnatten.luissilva.eu/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="My Culture Night: numbered picks on a dark map of Copenhagen"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
		<!-- 100% privacy-first analytics -->
		<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
